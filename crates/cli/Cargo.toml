[package]
name = "scopegate-ctl"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "CLI and TUI client for the ScopeGate gateway"

[[bin]]
name = "scopegatectl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json"] }
ratatui = "0.30"
crossterm = "0.29"
