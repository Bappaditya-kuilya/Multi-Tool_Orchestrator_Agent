[package]
name = "mcp-pool"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
async-trait.workspace = true
rmcp = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["process", "io-util", "sync", "time", "macros", "rt"] }
tracing = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
tokio-runtime = ["dep:tokio", "dep:serde_json"]
rmcp = ["dep:rmcp", "tokio-runtime", "dep:tracing"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "process", "io-util", "sync", "time"] }
async-trait.workspace = true
