[pytest]
testpaths = .
python_files = test_*.py
addopts = -ra
markers =
    baseline: measure block rate without enforcement (observation mode)
    dryrun: log would-block decisions without blocking
    enforce: assert enforcement blocks the attack (target mode)
    live: live gateway integration cases (require SCOPEGATE_GATEWAY_URL / --gateway-url)
    injection_exfil: prompt/tool-output injection leading to data exfiltration
    scope_escalation: child or call exceeds granted scopes/capabilities
    confused_deputy: trick gateway/tool into acting on attacker-chosen authority
    tool_poisoning: malicious/poisoned tool metadata or outputs alter behavior
    rug_pull: tool behavior/manifest changes after trust is established
    secret_leak: upstream secrets or sensitive data exposed to agent/logs
    dos_inputs: resource-exhaustion or malformed inputs crash/hang the gateway
    audit_tamper: audit log missing, incorrect, or tamper-evident chain broken
