[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scopegate-sdk"
version = "0.0.1.dev0"
description = "ScopeGate Python SDK (API-shaped scaffold; runtime transport/integration pending)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# Planned once runtime client is implemented:
# http = ["httpx>=0.27"]
# dev = ["pytest", "ruff", "mypy"]

[project.urls]
Repository = "https://example.invalid/scopegate"
Documentation = "https://example.invalid/scopegate/docs"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

