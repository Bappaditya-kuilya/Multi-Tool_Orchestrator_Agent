# ScopeGate - development compose (SQLite S1 preview)
# Intent: single gateway node + dashboard dev server with SQLite/WAL state volume.
# Runtime wiring is still partial; use for local preview/checks, not production proof.
#
# Quick start:
#   docker compose -f docker/compose.yml up --build
# Optional real upstream wiring (pass-through to gateway env shortcuts):
#   GATEWAY_MCP_UPSTREAM_URL=http://host.docker.internal:9000/mcp docker compose -f docker/compose.yml up --build
#   # or stdio: GATEWAY_MCP_UPSTREAM_CMD=... GATEWAY_MCP_UPSTREAM_ARGS="..." (requires command in image)

name: scopegate

services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
      args:
        RUST_VERSION: "1.77"
    image: scopegate-gateway:dev
    container_name: scopegate-gateway
    ports:
      - "8080:8080"   # HTTP API/MCP/ops (scaffolded runtime surfaces)
    environment:
      # Config + bind (gateway reads GATEWAY_CONFIG; SCOPEGATE_CONFIG kept for script/tooling compat)
      GATEWAY_CONFIG: /app/scopegate.toml
      SCOPEGATE_CONFIG: /app/scopegate.toml
      GATEWAY_ADDR: 0.0.0.0:8080
      SCOPEGATE_BIND_ADDR: 0.0.0.0:8080
      # SQLite S1 defaults (gateway accepts GATEWAY_*/SCOPEGATE_*/DATABASE_URL aliases)
      GATEWAY_STORE_BACKEND: ${GATEWAY_STORE_BACKEND:-${SCOPEGATE_STORE_BACKEND:-sqlite_wal}}
      SCOPEGATE_STORE_BACKEND: ${SCOPEGATE_STORE_BACKEND:-${GATEWAY_STORE_BACKEND:-sqlite_wal}}
      GATEWAY_DATABASE_URL: ${GATEWAY_DATABASE_URL:-${SCOPEGATE_DATABASE_URL:-sqlite:///data/scopegate.db}}
      SCOPEGATE_DATABASE_URL: ${SCOPEGATE_DATABASE_URL:-${GATEWAY_DATABASE_URL:-sqlite:///data/scopegate.db}}
      SCOPEGATE_STORE_URL: ${SCOPEGATE_STORE_URL:-${SCOPEGATE_DATABASE_URL:-${GATEWAY_DATABASE_URL:-sqlite:///data/scopegate.db}}}
      # Safety/runtime knobs
      GATEWAY_FAIL_CLOSED: ${GATEWAY_FAIL_CLOSED:-true}
      SCOPEGATE_FAIL_CLOSED_ON_AUDIT_ERROR: ${SCOPEGATE_FAIL_CLOSED_ON_AUDIT_ERROR:-true}
      RUST_LOG: ${RUST_LOG:-info}
      # Real upstream wiring passthrough (optional; configure a reachable MCP upstream)
      GATEWAY_MCP_MODE: ${GATEWAY_MCP_MODE:-http}
      GATEWAY_MCP_DEFAULT_UPSTREAM: ${GATEWAY_MCP_DEFAULT_UPSTREAM:-}
      GATEWAY_MCP_UPSTREAM_ID: ${GATEWAY_MCP_UPSTREAM_ID:-}
      GATEWAY_MCP_UPSTREAM_URL: ${GATEWAY_MCP_UPSTREAM_URL:-}
      GATEWAY_MCP_UPSTREAM_CMD: ${GATEWAY_MCP_UPSTREAM_CMD:-}
      GATEWAY_MCP_UPSTREAM_ARGS: ${GATEWAY_MCP_UPSTREAM_ARGS:-}
      # Optional runtime hooks / limits
      GATEWAY_PERSIST_AUDIT_EVENTS: ${GATEWAY_PERSIST_AUDIT_EVENTS:-}
      GATEWAY_SYNC_REVOCATIONS_FROM_STORE: ${GATEWAY_SYNC_REVOCATIONS_FROM_STORE:-}
      GATEWAY_USE_APPROVAL_STORE: ${GATEWAY_USE_APPROVAL_STORE:-}
      GATEWAY_ENABLE_RATE_LIMIT_STATE: ${GATEWAY_ENABLE_RATE_LIMIT_STATE:-}
      # SCOPEGATE_ADMIN_BIND_ADDR: 0.0.0.0:8081
      # SCOPEGATE_REDIS_URL: redis://redis:6379 (S2 events/approvals)
    volumes:
      - ../scopegate.toml.example:/app/scopegate.toml:ro
      - gateway-data:/data # SQLite/WAL persistence for default DB path
    healthcheck:
      # /healthz is implemented in current gateway HTTP server; treat as best-effort probe during startup/partial wiring.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  dashboard:
    # Dev scaffold: runs Vite against mounted dashboard source. No backend integration yet.
    image: node:20-alpine
    container_name: scopegate-dashboard
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"]
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    volumes:
      - ../dashboard:/app
      - dashboard-node-modules:/app/node_modules
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped

  # --- S2 profile placeholders (enable when multi-node/HA work begins) ---
