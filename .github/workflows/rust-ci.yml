name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all

      # Best-effort security checks (non-blocking until tooling/policy is stabilized).
      - name: Cargo audit (best effort)
        continue-on-error: true
        run: |
          if command -v cargo-audit >/dev/null 2>&1; then
            cargo audit
          else
            echo "cargo-audit not installed; skipping (best effort)"
          fi

      - name: Cargo deny (best effort)
        continue-on-error: true
        run: |
          if command -v cargo-deny >/dev/null 2>&1; then
            cargo deny check
          else
            echo "cargo-deny not installed; skipping (best effort)"
          fi
